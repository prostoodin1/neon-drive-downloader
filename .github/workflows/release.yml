name: Build Neon Drive Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all tests in isolated Qt processes
        run: python scripts/run_tests.py
      - name: Download verified bundled Rclone
        run: python scripts/fetch_rclone.py
      - name: Verify real transfer and cancellation
        run: python scripts/run_tests.py tests.test_beta7.Beta7Tests.test_real_rclone_copy_reports_bytes_and_preserves_hash tests.test_beta8.Beta8Tests.test_visible_stop_ends_real_rclone_without_modifying_source
      - name: Build application, hidden CLI, and version manager
        run: |
          python -m PyInstaller --noconfirm --clean NeonDriveDownloader.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean NeonDriveInstaller.spec
      - name: Smoke-test packaged application
        run: python scripts/smoke_bundle.py dist/NeonDriveDownloader
      - name: Verify standalone installer HTTPS without GitHub CLI
        run: python scripts/smoke_installer.py dist/NeonDriveInstaller.exe
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          $versionParts = @([regex]::Matches($version, "\d+") | Select-Object -First 4 | ForEach-Object { $_.Value })
          while ($versionParts.Count -lt 4) { $versionParts += "0" }
          $fileVersion = $versionParts -join "."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "/DMyAppFileVersion=$fileVersion" installer.iss
      - name: Verify installers
        shell: pwsh
        run: |
          foreach ($path in @("dist/NeonDrive-Setup.exe", "dist/NeonDriveInstaller.exe")) {
            $file = Get-Item $path
            if ($file.Length -lt 1000000) { throw "$path is unexpectedly small" }
            Get-FileHash $file.FullName -Algorithm SHA256
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/NeonDrive-Setup.exe
            dist/NeonDriveInstaller.exe
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            rclone_arch: amd64
          - runner: macos-15
            arch: arm64
            rclone_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run cross-platform tests
        run: python scripts/run_tests.py tests.test_copy_engines tests.test_google_drive tests.test_updater tests.test_platform_support tests.test_beta6 tests.test_beta7 tests.test_beta8 tests.test_beta9 tests.test_single_instance tests.test_windows_startup.WindowsStartupTests.test_macos_launch_agent_can_be_enabled_and_removed tests.test_rclone_manager.RcloneManagerTests.test_macos_archive_is_verified_and_installed_as_executable
      - name: Download verified native Rclone
        run: python scripts/fetch_rclone.py --platform osx --arch ${{ matrix.rclone_arch }} --force
      - name: Verify real transfer and cancellation
        run: python scripts/run_tests.py tests.test_beta7.Beta7Tests.test_real_rclone_copy_reports_bytes_and_preserves_hash tests.test_beta8.Beta8Tests.test_visible_stop_ends_real_rclone_without_modifying_source
      - name: Build macOS application
        run: |
          python -m PyInstaller --noconfirm --clean NeonDriveDownloader.spec
          python -m PyInstaller --noconfirm --clean NeonDriveInstallerMac.spec
      - name: Smoke-test packaged application
        run: python scripts/smoke_bundle.py "dist/Neon Drive.app"
      - name: Verify native bundles and LaunchServices startup
        run: python scripts/smoke_macos.py
      - name: Verify standalone installer HTTPS without GitHub CLI
        run: python scripts/smoke_installer.py "dist/Neon Drive Installer.app/Contents/MacOS/NeonDriveInstaller"
      - name: Create application and version manager DMGs
        run: |
          mkdir -p dist/dmg
          cp -R "dist/Neon Drive.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Neon Drive" -srcfolder dist/dmg -ov -format UDZO dist/NeonDrive-macOS-${{ matrix.arch }}.dmg
          mkdir -p dist/installer-dmg
          cp -R "dist/Neon Drive Installer.app" dist/installer-dmg/
          ln -s /Applications dist/installer-dmg/Applications
          hdiutil create -volname "Neon Drive Installer" -srcfolder dist/installer-dmg -ov -format UDZO dist/NeonDriveInstaller-macOS-${{ matrix.arch }}.dmg
          shasum -a 256 dist/*.dmg
      - name: Test DMG install, replacement and uninstall
        run: python scripts/smoke_macos_install.py dist/NeonDrive-macOS-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          args=()
          if [[ "$tag" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" release/*.exe release/*.dmg --title "Neon Drive $tag" --notes-file RELEASE_NOTES.md "${args[@]}"
      - name: Update public fallback catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release_catalog.py
